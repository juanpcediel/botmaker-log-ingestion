AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Botmaker Log Ingestion Pipeline - Serverless webhook ingestion,
  normalization to 16-field schema, Parquet conversion via Firehose,
  and S3 storage with daily partitions queryable via Athena.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment (dev or prod)
    Default: dev
    AllowedValues:
      - dev
      - prod

  FirehoseBufferIntervalSeconds:
    Type: Number
    Description: >
      Firehose buffer interval in seconds. Records are delivered when
      this interval expires or the buffer size is reached, whichever comes first.
    Default: 300
    MinValue: 60
    MaxValue: 900

  FirehoseBufferSizeMB:
    Type: Number
    Description: >
      Firehose buffer size in MB. Minimum is 64 MB when format conversion
      (JSON to Parquet) is enabled.
    Default: 64
    MinValue: 64
    MaxValue: 128

  PartitionProjectionStartDate:
    Type: String
    Description: >
      Start date for Athena partition projection in yyyy-MM-dd format.
      Partitions before this date will not be projected.
    Default: '2026-01-01'

  ParquetCompression:
    Type: String
    Description: Compression algorithm used by the Parquet serializer in Firehose.
    Default: SNAPPY
    AllowedValues:
      - SNAPPY
      - GZIP
      - UNCOMPRESSED

  AthenaBytesScannedCutoffPerQuery:
    Type: Number
    Description: >
      Maximum number of bytes that Athena will scan per query.
      Queries exceeding this limit are cancelled. Set to 0 to disable.
    Default: 0

  AthenaResultsRetentionDays:
    Type: Number
    Description: Number of days to retain Athena query results in S3.
    Default: 30
    MinValue: 1

  EnableAthenaWorkGroup:
    Type: String
    Description: Whether to provision the Athena WorkGroup and named queries.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  LogPayload:
    Type: String
    Description: >
      Whether to log request payloads (metadata only). Set to false
      to suppress payload logging entirely.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10

Conditions:
  IsAthenaEnabled: !Equals
    - !Ref EnableAthenaWorkGroup
    - 'true'
  HasBytesScannedCutoff: !And
    - !Condition IsAthenaEnabled
    - !Not
      - !Equals
        - !Ref AthenaBytesScannedCutoffPerQuery
        - 0

Resources:
  # =============================================================================
  # S3 Bucket — stores Parquet data, Firehose errors, and Athena results
  # =============================================================================
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'botmaker-log-ingestion-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LogsBucket.Arn
              - !Sub '${LogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # =============================================================================
  # Secrets Manager — stores the webhook Bearer token for authentication
  # =============================================================================
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/${Environment}/webhook-secret'
      Description: Bearer token used to authenticate Botmaker webhook requests
      SecretString: 'CHANGE_ME_AFTER_DEPLOYMENT'

  # =============================================================================
  # CloudWatch Log Groups — Lambda and API Gateway access logs (30-day retention)
  # =============================================================================
  IngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ingestion-function'
      RetentionInDays: 30

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-access-logs'
      RetentionInDays: 30

  # =============================================================================
  # API Gateway HTTP API — receives POST /webhook requests from Botmaker
  # =============================================================================
  WebhookHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-webhook-api'
      ProtocolType: HTTP
      Description: HTTP API for Botmaker webhook ingestion

  WebhookHttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebhookHttpApi
      StageName: '$default'
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "protocol":"$context.protocol","responseLength":"$context.responseLength",
          "integrationError":"$context.integrationErrorMessage"}

  WebhookHttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebhookHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt IngestionFunction.Arn
      PayloadFormatVersion: '2.0'

  WebhookHttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebhookHttpApi
      RouteKey: 'POST /webhook'
      Target: !Sub 'integrations/${WebhookHttpApiIntegration}'

  # Permission for API Gateway to invoke the Lambda function
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebhookHttpApi}/*'

  # =============================================================================
  # Lambda Function — ingestion, normalization, and Firehose delivery
  # =============================================================================
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ingestion-function'
      Handler: handler.lambda_handler
      CodeUri: src/
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 1000
      LoggingConfig:
        LogGroup: !Ref IngestionFunctionLogGroup
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          FIREHOSE_STREAM_NAME: !Sub '${AWS::StackName}-firehose-stream'
          SECRET_ID: !Ref WebhookSecret
          LOG_LEVEL: INFO
          LOG_PAYLOAD: !Ref LogPayload
      Role: !GetAtt IngestionFunctionRole.Arn

  # =============================================================================
  # Lambda IAM Role — least-privilege: Firehose PutRecord, Secrets Manager, Logs
  # =============================================================================
  IngestionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ingestion-function-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt IngestionFunctionLogGroup.Arn
                  - !Sub '${IngestionFunctionLogGroup.Arn}:*'
        - PolicyName: FirehosePutRecordPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'firehose:PutRecord'
                Resource:
                  - !Sub 'arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/${AWS::StackName}-firehose-stream'
        - PolicyName: SecretsManagerGetSecretPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource:
                  - !Ref WebhookSecret

  # =============================================================================
  # CloudWatch Log Group — Firehose delivery and conversion errors (30-day retention)
  # =============================================================================
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/firehose/${AWS::StackName}-firehose-stream'
      RetentionInDays: 30

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: S3Delivery

  # =============================================================================
  # Firehose IAM Role — least-privilege: S3 put, Glue catalog, KMS, CloudWatch Logs
  # =============================================================================
  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-firehose-delivery-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                sts:ExternalId: !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: S3DeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:PutObjectAcl'
                Resource:
                  - !Sub '${LogsBucket.Arn}/*'
        - PolicyName: GlueCatalogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'glue:GetTable'
                  - 'glue:GetTableVersions'
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${AWS::StackName}-${Environment}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-${Environment}/*'
        - PolicyName: KmsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:GenerateDataKey'
                Resource:
                  - !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt FirehoseLogGroup.Arn
                  - !Sub '${FirehoseLogGroup.Arn}:*'

  # =============================================================================
  # Amazon Data Firehose — DirectPut, JSON→Parquet conversion, Extended S3 destination
  # =============================================================================
  FirehoseDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - FirehoseLogGroup
      - FirehoseLogStream
    Properties:
      DeliveryStreamName: !Sub '${AWS::StackName}-firehose-stream'
      DeliveryStreamType: DirectPut
      DeliveryStreamEncryptionConfiguration:
        KeyType: AWS_OWNED_CMK
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt LogsBucket.Arn
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn
        Prefix: 'data/ingestion_date=!{timestamp:yyyy-MM-dd}/'
        ErrorOutputPrefix: 'firehose-errors/type=!{firehose:error-output-type}/ingestion_date=!{timestamp:yyyy-MM-dd}/'
        FileExtension: '.parquet'
        CustomTimeZone: 'America/Bogota'
        CompressionFormat: UNCOMPRESSED
        BufferingHints:
          SizeInMBs: !Ref FirehoseBufferSizeMB
          IntervalInSeconds: !Ref FirehoseBufferIntervalSeconds
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: S3Delivery
        DataFormatConversionConfiguration:
          Enabled: true
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe: {}
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe:
                Compression: !Ref ParquetCompression
          SchemaConfiguration:
            DatabaseName: !Ref BotmakerLogsDatabase
            TableName: !Ref BotmakerLogsTable
            RoleARN: !GetAtt FirehoseDeliveryRole.Arn
            Region: !Ref 'AWS::Region'
            VersionId: LATEST

  # =============================================================================
  # Glue Data Catalog — Database and Table for Parquet schema (Athena queryable)
  # =============================================================================
  BotmakerLogsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseInput:
        Name: !Sub '${AWS::StackName}-${Environment}'
        Description: Glue database for Botmaker log ingestion pipeline

  BotmakerLogsTable:
    Type: AWS::Glue::Table
    DependsOn: BotmakerLogsDatabase
    Properties:
      CatalogId: !Ref 'AWS::AccountId'
      DatabaseName: !Ref BotmakerLogsDatabase
      TableInput:
        Name: botmaker_logs
        Description: Normalized Botmaker webhook events stored as Parquet with daily partitions
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.ingestion_date.type: date
          projection.ingestion_date.format: yyyy-MM-dd
          projection.ingestion_date.range: !Sub '${PartitionProjectionStartDate},NOW'
          projection.ingestion_date.interval: '1'
          projection.ingestion_date.interval.unit: DAYS
          storage.location.template: !Sub 's3://${LogsBucket}/data/ingestion_date=${!ingestion_date}/'
        StorageDescriptor:
          Location: !Sub 's3://${LogsBucket}/data/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - Name: ingestion_id
              Type: string
            - Name: event_id
              Type: string
            - Name: request_id
              Type: string
            - Name: received_at
              Type: string
            - Name: schema_version
              Type: int
            - Name: environment
              Type: string
            - Name: event_type
              Type: string
            - Name: conversation_id
              Type: string
            - Name: message_id
              Type: string
            - Name: user_id
              Type: string
            - Name: order_form_id
              Type: string
            - Name: source_channel
              Type: string
            - Name: source_bot
              Type: string
            - Name: severity
              Type: string
            - Name: error_code
              Type: string
            - Name: raw_event_json
              Type: string
        PartitionKeys:
          - Name: ingestion_date
            Type: string

  # =============================================================================
  # Amazon Athena — WorkGroup and Named Queries (conditional on IsAthenaEnabled)
  # =============================================================================
  BotmakerAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Condition: IsAthenaEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-workgroup'
      Description: Athena WorkGroup for querying Botmaker ingested logs
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: !If
          - HasBytesScannedCutoff
          - !Ref AthenaBytesScannedCutoffPerQuery
          - !Ref 'AWS::NoValue'
        ResultConfiguration:
          OutputLocation: !Sub 's3://${LogsBucket}/athena-results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  RecordCountByDateQuery:
    Type: AWS::Athena::NamedQuery
    Condition: IsAthenaEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-record-count-by-date'
      Description: Count total records for a specific ingestion date
      Database: !Ref BotmakerLogsDatabase
      WorkGroup: !Ref BotmakerAthenaWorkGroup
      QueryString: |
        SELECT ingestion_date, count(*) as total
        FROM "botmaker_logs"
        WHERE ingestion_date = 'YYYY-MM-DD'
        GROUP BY ingestion_date

  RecentEventsQuery:
    Type: AWS::Athena::NamedQuery
    Condition: IsAthenaEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-recent-events'
      Description: Retrieve the most recent 100 events for a specific date
      Database: !Ref BotmakerLogsDatabase
      WorkGroup: !Ref BotmakerAthenaWorkGroup
      QueryString: |
        SELECT *
        FROM "botmaker_logs"
        WHERE ingestion_date = 'YYYY-MM-DD'
        ORDER BY received_at DESC
        LIMIT 100

  EventsByTypeQuery:
    Type: AWS::Athena::NamedQuery
    Condition: IsAthenaEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-events-by-type'
      Description: Count events grouped by event type within a date range
      Database: !Ref BotmakerLogsDatabase
      WorkGroup: !Ref BotmakerAthenaWorkGroup
      QueryString: |
        SELECT event_type, count(*) as total
        FROM "botmaker_logs"
        WHERE ingestion_date BETWEEN 'START' AND 'END'
        GROUP BY event_type
        ORDER BY total DESC

  ErrorsBySeverityQuery:
    Type: AWS::Athena::NamedQuery
    Condition: IsAthenaEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-errors-by-severity'
      Description: List error events with severity for a specific date
      Database: !Ref BotmakerLogsDatabase
      WorkGroup: !Ref BotmakerAthenaWorkGroup
      QueryString: |
        SELECT received_at, event_id, conversation_id, error_code, severity
        FROM "botmaker_logs"
        WHERE ingestion_date = 'YYYY-MM-DD'
          AND severity IS NOT NULL
        ORDER BY received_at DESC

# =============================================================================
# Stack Outputs — key resource identifiers and endpoints
# =============================================================================
Outputs:
  ApiEndpoint:
    Description: The API Gateway HTTP API URL for webhook ingestion
    Value: !Sub 'https://${WebhookHttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  GlueDatabaseName:
    Description: Name of the Glue Data Catalog database
    Value: !Ref BotmakerLogsDatabase

  GlueTableName:
    Description: Name of the Glue Data Catalog table
    Value: botmaker_logs

  GlueTableArn:
    Description: ARN of the Glue Data Catalog table
    Value: !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${BotmakerLogsDatabase}/botmaker_logs'

  AthenaWorkGroupName:
    Description: Name of the Athena WorkGroup for querying logs
    Condition: IsAthenaEnabled
    Value: !Ref BotmakerAthenaWorkGroup

  AthenaResultsLocation:
    Description: S3 location where Athena query results are stored
    Condition: IsAthenaEnabled
    Value: !Sub 's3://${LogsBucket}/athena-results/'

  ParquetDataPrefix:
    Description: S3 prefix where Parquet data files are stored
    Value: !Sub 's3://${LogsBucket}/data/'

  FirehoseErrorPrefix:
    Description: S3 prefix where Firehose error records are stored
    Value: !Sub 's3://${LogsBucket}/firehose-errors/'

  FirehoseStreamName:
    Description: Name of the Firehose delivery stream
    Value: !Ref FirehoseDeliveryStream

  LogsBucketName:
    Description: Name of the S3 bucket storing all pipeline data
    Value: !Ref LogsBucket
