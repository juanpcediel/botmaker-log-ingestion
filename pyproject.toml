[project]
name = "botmaker-log-ingestion"
version = "0.1.0"
description = "Serverless log ingestion pipeline for Botmaker webhook events"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=85",
    "--junitxml=reports/junit.xml",
    "-v",
]
markers = [
    "integration: marks tests requiring a deployed AWS stack",
    "smoke: marks production smoke tests",
    "property: marks property-based tests (Hypothesis)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.hypothesis]
max_examples = 100
deadline = 5000
suppress_health_check = ["too_slow"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "ERA", "PL", "RUF"]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
