version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
  build:
    commands:
      - sam build
      - sam package --output-template-file packaged-template.yaml --resolve-s3
artifacts:
  files:
    - packaged-template.yaml
  discard-paths: no
