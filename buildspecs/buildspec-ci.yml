version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install --upgrade pip
      - pip install -r requirements-dev.txt
  pre_build:
    commands:
      - ruff check .
      - ruff format --check .
  build:
    commands:
      - pytest tests/unit/ tests/properties/ tests/schema/ tests/infra/ --cov=src --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/unit-tests.xml --cov-fail-under=85 -v
      - sam validate --lint --template-file template.yaml
      - cfn-lint template.yaml pipeline/codepipeline.yaml
      - sam build
reports:
  UnitTestReports:
    files:
      - reports/unit-tests.xml
    file-format: JUNITXML
  CoverageReports:
    files:
      - reports/coverage.xml
    file-format: COBERTURAXML
artifacts:
  files:
    - '**/*'
  base-directory: .
cache:
  paths:
    - '/root/.cache/pip/**/*'
